name: Verify bridge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s test -p '*_test.py'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  cosmic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: bridge
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: P0nk/Cosmic
          ref: fec53bc7714dc0f1ae3f50b2986cdf2727e0912a
          path: cosmic
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: python bridge/tools/install-cosmic.py cosmic --check
      - run: python bridge/tools/install-cosmic.py cosmic
      - run: bash ./mvnw test
        working-directory: cosmic
