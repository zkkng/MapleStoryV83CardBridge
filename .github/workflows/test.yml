name: Verify bridge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s test -p '*_test.py'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  cosmic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: bridge
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: P0nk/Cosmic
          ref: fec53bc7714dc0f1ae3f50b2986cdf2727e0912a
          path: cosmic
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: python bridge/tools/install-cosmic.py cosmic --check
      - run: python bridge/tools/install-cosmic.py cosmic
      - run: bash ./mvnw test
        working-directory: cosmic
  managed-cosmic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install a complete fresh Cosmic deployment
        run: python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" install --test-account
      - name: Check funding retries and readiness
        run: |
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" account fund CardTest --cash-type 4 --amount 5000 --request-id setup-funding-v1
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" doctor
      - name: Restart and verify persistent issued cards
        run: |
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" stop
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" start
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" smoke
      - name: Back up, restore and verify
        run: |
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" backup
          backup=$(find "$RUNNER_TEMP/CosmicCardServer/backups" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" restore --backup "$backup"
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" smoke
      - name: Upgrade and verify
        run: |
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" upgrade
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" smoke
      - name: Remove the disposable deployment
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/CosmicCardServer/compose.json" ]; then
            docker compose -f "$RUNNER_TEMP/CosmicCardServer/compose.json" down --volumes --remove-orphans
          fi
