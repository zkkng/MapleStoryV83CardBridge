# Include these locations in your TLS-enabled server block.
location = /api/library/admin/preview {
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:8487;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 25s;
}
location /library/ {
    proxy_pass http://127.0.0.1:8487;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 25s;
}
location = /library { return 302 /library/; }
location /assets/library/ {
    proxy_pass http://127.0.0.1:8487;
    proxy_set_header Host $http_host;
}
location /api/library/ {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8487;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 25s;
}
# Preserve the existing account website's other routes in portal session mode.
